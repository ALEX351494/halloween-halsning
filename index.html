<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>En Kuslig Halloween-Hälsning! 🎃</title>
    <!-- Hämtar läskiga Halloween-typsnitt från Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Mountains+of+Christmas:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <style>
        /* BASE & BACKGROUND STYLES */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0d021a 0%, #1f0836 50%, #000000 100%);
            font-family: 'Poppins', sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* ANIMERAD HALLOWEEN-BAKGRUND (FALLANDE PUMPOR & SPÖKEN) */
        .spooky-rain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .falling-item {
            position: absolute;
            top: -50px;
            font-size: 2rem;
            opacity: 0.8;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-50px) rotate(0deg);
                opacity: 0.9;
            }
            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0.2;
            }
        }

        /* RUBRIK */
        h1.title {
            font-family: 'Creepster', cursive;
            font-size: 3rem;
            color: #ff7518;
            text-shadow: 0 0 10px #ff7518, 0 0 20px #800080, 0 0 30px #000;
            margin-bottom: 25px;
            text-align: center;
            letter-spacing: 2px;
            z-index: 10;
            animation: pulseGlow 2s infinite alternate;
        }

        @keyframes pulseGlow {
            from { text-shadow: 0 0 10px #ff7518, 0 0 20px #800080; }
            to { text-shadow: 0 0 20px #ff7518, 0 0 35px #ff0000, 0 0 10px #ffffff; }
        }

        /* CONTAINER FÖR KUVÄR OCH KORT */
        .card-container {
            position: relative;
            width: 340px;
            height: 240px;
            z-index: 10;
            perspective: 1000px;
            cursor: pointer;
        }

        /* KUVÄRET */
        .envelope {
            width: 100%;
            height: 100%;
            background: #2a1138;
            border: 2px solid #ff7518;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(255, 117, 24, 0.3);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.6s ease, opacity 0.5s ease;
            overflow: hidden;
        }

        .envelope::before {
            content: '';
            position: absolute;
            top: 0;
            width: 0;
            height: 0;
            border-left: 170px solid transparent;
            border-right: 170px solid transparent;
            border-top: 130px solid #3d1b50;
            transform-origin: top;
            transition: transform 0.5s ease;
            z-index: 3;
        }

        .envelope-seal {
            position: absolute;
            width: 60px;
            height: 60px;
            background: #ff7518;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 4;
            transition: transform 0.3s;
        }

        .envelope:hover .envelope-seal {
            transform: scale(1.1);
        }

        .click-hint {
            position: absolute;
            bottom: 15px;
            font-size: 0.9rem;
            color: #d8b4fe;
            z-index: 4;
            font-weight: 600;
            animation: bounce 1.5s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        /* HALLOWEEN-KORTET (VISAS NÄR MAN KLICKAR) */
        .letter {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            min-height: 380px;
            background: radial-gradient(circle, #2d0b45 0%, #150224 100%);
            border: 3px solid #ff7518;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 0 25px rgba(255, 117, 24, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            opacity: 0;
            transform: scale(0.5) translateY(100px);
            pointer-events: none;
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 20;
        }

        /* NÄR KUVÄRET ÖPPNAS */
        .open .envelope {
            opacity: 0;
            transform: scale(0.8) translateY(50px);
            pointer-events: none;
        }

        .open .letter {
            opacity: 1;
            transform: scale(1) translateY(-60px);
            pointer-events: auto;
        }

        /* KORTETS INNEHÅLL */
        .letter h2 {
            font-family: 'Creepster', cursive;
            color: #ff7518;
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        .letter p {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #e2d9f3;
            margin-bottom: 15px;
        }

        .ghost-img {
            width: 100px;
            height: auto;
            margin: 10px 0;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.6));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .close-btn {
            margin-top: auto;
            padding: 8px 18px;
            background: #ff7518;
            color: #000;
            border: none;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .close-btn:hover {
            background: #ffa500;
        }

        /* FOOTER */
        footer {
            margin-top: 80px;
            font-size: 0.85rem;
            color: #8a73a5;
            z-index: 10;
        }
    </style>
</head>
<body>

    <!-- Fallande bakgrundsobjekt -->
    <div class="spooky-rain" id="rainContainer"></div>

    <!-- Rubrik -->
    <h1 class="title">Bus eller Godis? 🎃</h1>

    <!-- Interaktiv kort-container -->
    <div class="card-container" id="cardContainer" onclick="toggleCard()">
        
        <!-- Kuvertet -->
        <div class="envelope">
            <div class="envelope-seal">🎃</div>
            <div class="click-hint">Klicka för att öppna! ✉️</div>
        </div>

        <!-- Hälsningskortet inuti -->
        <div class="letter" id="letter">
            <h2>GLAD HALLOWEEN! 👻</h2>
            
            <!-- Spöke / Bild -->
            <div class="ghost-img">👻</div>

            <p>
                Hoppas du får en riktigt läskig och mysig Halloween fylld med massor av godis och inga bus! 🍬🍫
            </p>
            <p style="font-style: italic; color: #ff7518; font-size: 0.95rem;">
                "När mörkret faller och pumporna lyser..."
            </p>

            <button class="close-btn" onclick="event.stopPropagation(); toggleCard();">Stäng kortet</button>
        </div>

    </div>

    <footer>
        Skapad av mig | Halloween 2026
    </footer>

    <script>
        // Funktion för att öppna/stänga kuvertet
        function toggleCard() {
            const container = document.getElementById('cardContainer');
            container.classList.toggle('open');
        }

        // Skapa fallande pumpor, spöken och fladdermöss i bakgrunden
        const items = ['🎃', '👻', '🦇', '🕷️', '🍬'];
        const rainContainer = document.getElementById('rainContainer');
        const itemCount = 25; // Antal fallande objekt

        for (let i = 0; i < itemCount; i++) {
            const item = document.createElement('div');
            item.classList.add('falling-item');
            
            // Slumpa symbol
            item.innerText = items[Math.floor(Math.random() * items.length)];
            
            // Slumpa position och animationstid
            item.style.left = Math.random() * 100 + 'vw';
            item.style.animationDuration = (Math.random() * 3 + 4) + 's'; // 4-7 sekunder
            item.style.animationDelay = (Math.random() * 5) + 's';
            item.style.fontSize = (Math.random() * 1.5 + 1.2) + 'rem';

            rainContainer.appendChild(item);
        }
    </script>
</body>
</html>
